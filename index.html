<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SRS — Supplier Risk Sensing · Agentic Supply Risk Command Center</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-theme="light">

<div class="shell">

  <!-- ======= Sidebar ======= -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 L20 6.5 V13 C20 17.5 16.5 21 12 22 C7.5 21 4 17.5 4 13 V6.5 Z"/>
          <circle cx="12" cy="11" r="3"/>
          <path d="M12 14 v3"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">SRS</span>
        <span class="brand-sub">Supplier Risk Sensing</span>
      </div>
    </div>

    <nav class="sidebar-nav" id="nav"><!-- populated by app.js --></nav>

    <div class="sidebar-foot">
      <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span class="theme-label">Dark mode</span>
      </button>
      <div class="sidebar-user">
        <div class="avatar">VK</div>
        <div class="user-meta">
          <span class="user-name">Vineet K</span>
          <span class="user-role">Category Manager</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ======= Main ======= -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title" id="pageTitle">Command Center</h1>
        <span class="page-crumb" id="pageCrumb">NovaForge Manufacturing · Global</span>
      </div>
      <div class="topbar-right">
        <div class="global-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" id="globalSearch" placeholder="Search suppliers, materials, SKUs, events…" />
          <div class="search-results" id="searchResults"></div>
        </div>
        <span class="refresh-stamp">Data as of <strong>09 Jul 2026, 06:00 UTC</strong></span>
        <button class="icon-btn" id="notifBtn" title="Alerts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="notif-dot" id="notifDot"></span>
        </button>
        <button class="copilot-launch" id="copilotBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.7 4.6L18 9.2l-4.3 1.6L12 15.4l-1.7-4.6L6 9.2l4.3-1.6Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/></svg>
          Ask Copilot
        </button>
      </div>
    </header>

    <div class="notif-panel" id="notifPanel"><!-- populated by app.js --></div>

    <main class="page" id="page"><!-- routed pages render here --></main>
  </div>
</div>

<!-- ======= Detail drawer ======= -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-titles">
      <span class="drawer-kicker" id="drawerKicker"></span>
      <h2 id="drawerTitle"></h2>
    </div>
    <button class="icon-btn" id="drawerClose" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- ======= Copilot panel ======= -->
<aside class="copilot" id="copilot">
  <div class="copilot-head">
    <div class="copilot-id">
      <div class="copilot-orb"></div>
      <div>
        <strong>Risk Copilot</strong>
        <span>Natural-language risk intelligence</span>
      </div>
    </div>
    <button class="icon-btn" id="copilotClose" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="copilot-thread" id="copilotThread"></div>
  <div class="copilot-suggests" id="copilotSuggests"></div>
  <form class="copilot-input" id="copilotForm">
    <input type="text" id="copilotText" placeholder="Ask about suppliers, materials, exposure…" autocomplete="off" />
    <button type="submit" class="btn btn-primary">Send</button>
  </form>
</aside>

<!-- ======= Modal ======= -->
<div class="modal-scrim" id="modalScrim">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" id="modalClose" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="vendor/echarts.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/components.js"></script>
<script src="js/copilot.js"></script>
<script src="js/pages/overview.js"></script>
<script src="js/pages/suppliers.js"></script>
<script src="js/pages/materials.js"></script>
<script src="js/pages/products.js"></script>
<script src="js/pages/events.js"></script>
<script src="js/pages/agents.js"></script>
<script src="js/pages/scenario.js"></script>
<script src="js/app.js"></script>
</body>
</html>
